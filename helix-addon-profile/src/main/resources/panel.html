<div class="card">
  <div class="card-head"><h2>Player profile</h2></div>
  <div class="card-body">
    <div class="row">
      <input id="p" placeholder="Player" style="max-width:200px">
      <button class="btn" id="load">Load</button>
    </div>
  </div>
</div>
<div id="result"></div>
<script>
"use strict";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
let currentPlayer = "";

function optionsHtml(setting) {
  const opts = setting.descriptor.type.options || [];
  return opts.map(o =>
    `<option value="${esc(o.id)}" ${o.id === setting.current ? "selected" : ""} ${o.unlocked ? "" : "disabled"}>${esc(o.label)}${o.unlocked ? "" : " (locked)"}</option>`
  ).join("");
}

function controlHtml(setting, index) {
  const kind = setting.descriptor.type.type;
  if (kind === "choice") {
    return `<select id="ctl-${index}">${optionsHtml(setting)}</select>`;
  }
  if (kind === "toggle") {
    return `<select id="ctl-${index}"><option value="true" ${setting.current === "true" ? "selected" : ""}>on</option><option value="false" ${setting.current === "false" ? "selected" : ""}>off</option></select>`;
  }
  return `<input id="ctl-${index}" value="${esc(setting.current)}" maxlength="${setting.descriptor.type.maxLength || 64}">`;
}

function settingsRows(settings) {
  return settings.map((s, i) => `<tr>
    <td><strong>${esc(s.descriptor.label)}</strong><div class="sub">${esc(s.owner)}:${esc(s.descriptor.key)}</div></td>
    <td>${controlHtml(s, i)}</td>
    <td style="text-align:right">
      <button class="btn sm subtle" data-set="${i}">Set</button>
      <button class="btn sm subtle" data-clear="${i}">Clear</button>
    </td>
  </tr>`).join("");
}

function infoRows(info) {
  const rows = [];
  Object.entries(info || {}).forEach(([owner, entries]) => {
    entries.forEach(e => rows.push(`<tr><td>${esc(owner)}</td><td>${esc(e.label)}</td><td>${esc(e.value)}</td></tr>`));
  });
  return rows.join("");
}

async function load() {
  const player = document.getElementById("p").value.trim();
  if (!player) return Helix.toast("player required");
  currentPlayer = player;
  const res = await Helix.action("profile.view", player);
  if (!res.success) return Helix.toast(res.lines[0] || "failed to load profile");
  let view; try { view = JSON.parse(res.lines[0]); } catch (e) { return Helix.toast("could not parse profile"); }

  const infoCard = Object.keys(view.info || {}).length
    ? `<div class="card"><div class="card-head"><h2>Info</h2></div>
       <table><thead><tr><th>Addon</th><th>Label</th><th>Value</th></tr></thead>
       <tbody>${infoRows(view.info)}</tbody></table></div>`
    : "";
  const settingsCard = view.settings.length
    ? `<div class="card"><div class="card-head"><h2>Settings</h2></div>
       <table><thead><tr><th>Setting</th><th>Value</th><th></th></tr></thead>
       <tbody>${settingsRows(view.settings)}</tbody></table></div>`
    : '<div class="card"><div class="card-body"><div class="empty">No settings registered.</div></div></div>';

  document.getElementById("result").innerHTML = infoCard + settingsCard;

  view.settings.forEach((s, i) => {
    document.querySelector(`[data-set="${i}"]`).onclick = async () => {
      const value = document.getElementById(`ctl-${i}`).value;
      const r = await Helix.action("profile.setting.admin-set", currentPlayer, s.owner, s.descriptor.key, value);
      Helix.toast(r.lines[0] || (r.success ? "updated" : "failed"));
      load();
    };
    document.querySelector(`[data-clear="${i}"]`).onclick = async () => {
      await Helix.action("profile.setting.clear", currentPlayer, s.owner, s.descriptor.key);
      Helix.toast("cleared");
      load();
    };
  });
}
document.getElementById("load").onclick = load;
</script>
