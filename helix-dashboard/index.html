<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3b2617" />
    <title>KronlandMC · Panel</title>
    <script>
      // Apply the stored colour mode before first paint (dark = wood is the default; see src/lib/theme.ts).
      try { if (localStorage.getItem("panel.theme") === "light") document.documentElement.classList.remove("dark") } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
