<div class="card">
  <div class="card-head"><h2>Groups</h2><div class="right"><button class="btn sm" id="new-group">+ New group</button></div></div>
  <div id="groups"><div class="empty">loading…</div></div>
</div>

<div class="card">
  <div class="card-head"><h2>Users</h2><div class="sub">everyone with explicit groups or permissions</div></div>
  <div id="users"><div class="empty">loading…</div></div>
  <div class="card-body" style="border-top:1px solid var(--line)">
    <label>Manage any player (also new ones)</label>
    <div class="row"><input id="user-name" placeholder="Player name" style="max-width:280px"><button class="btn subtle" id="user-load">Load</button></div>
    <div id="user-detail" style="margin-top:14px"></div>
  </div>
</div>

<div id="group-modal" class="backdrop hidden">
  <div class="modal">
    <div class="card-head"><h2>New group</h2></div>
    <div class="card-body">
      <div class="field"><label>Name</label><input id="g-name" placeholder="admin" autocomplete="off"></div>
      <div class="grid c2" style="margin-top:12px">
        <div class="field"><label>Weight (higher wins conflicts)</label><input id="g-weight" type="number" value="0"></div>
        <div class="field"><label>Default</label><label class="checkbox"><input type="checkbox" id="g-default"> assign to every player</label></div>
      </div>
      <div class="row" style="margin-top:16px;justify-content:flex-end">
        <button class="btn subtle" id="g-cancel">Cancel</button>
        <button class="btn" id="g-create">Create group</button>
      </div>
    </div>
  </div>
</div>

<datalist id="perm-catalog"></datalist>

<script>
"use strict";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
let doc = { groups: [], users: [] };
let catalog = [];

function remaining(ms) {
  if (ms <= 0) return "expired";
  const d = Math.floor(ms/86400000), h = Math.floor(ms%86400000/3600000), m = Math.floor(ms%3600000/60000);
  return d > 0 ? `${d}d ${h}h` : h > 0 ? `${h}h ${m}m` : `${Math.max(1,m)}m`;
}

async function loadCatalog() {
  try {
    const res = await Helix.action("perm.catalog");
    catalog = JSON.parse(res.lines[0] || "[]");
    document.getElementById("perm-catalog").innerHTML =
      catalog.map(e => `<option value="${esc(e.node)}">${esc(e.source)}</option>`).join("");
  } catch (e) { catalog = []; }
}

async function load() {
  const res = await Helix.action("perm.export");
  try { doc = JSON.parse(res.lines[0] || "{}"); } catch (e) { doc = { groups: [], users: [] }; }
  renderGroups();
  renderUsers();
}

function renderGroups() {
  const box = document.getElementById("groups");
  if (!doc.groups.length) { box.innerHTML = '<div class="empty">No groups yet — create one</div>'; return; }
  const sorted = [...doc.groups].sort((a, b) => (b.weight||0) - (a.weight||0));
  box.innerHTML = `<table><thead><tr><th>Group</th><th>Weight</th><th>Default</th><th>Parents</th><th>Permissions</th><th></th></tr></thead><tbody>${
    sorted.map(g => `<tr>
      <td><strong>${esc(g.name)}</strong></td>
      <td class="mono">${g.weight||0}</td>
      <td>${g.default ? '<span class="badge good">default</span>' : '<span class="muted">—</span>'}</td>
      <td>${(g.parents||[]).length ? (g.parents||[]).map(p=>`<span class="tag">${esc(p)}</span>`).join(" ") : '<span class="muted">—</span>'}</td>
      <td>${(g.permissions||[]).length ? `<span class="tag">${(g.permissions||[]).length} nodes</span>` : '<span class="muted">—</span>'}</td>
      <td style="text-align:right"><button class="btn sm subtle" data-edit="${esc(g.name)}">Edit</button> <button class="btn sm danger" data-del="${esc(g.name)}">Delete</button></td>
    </tr>${g._open ? groupEditor(g) : ""}`).join("")
  }</tbody></table>`;
  box.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => { const g = doc.groups.find(x=>x.name===b.dataset.edit); g._open = !g._open; renderGroups(); });
  box.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => { if (!confirm(`Delete group ${b.dataset.del}?`)) return; await Helix.action("perm.group.delete", b.dataset.del); Helix.toast("Deleted " + b.dataset.del); load(); });
  bindEditors();
}

function groupEditor(g) {
  return `<tr><td colspan="6" style="background:var(--surface-2)"><div class="card-body">
    <div class="grid c2">
      <div class="field"><label>Add permission node (pick from catalog or type any, -node negates, * wildcards)</label>
        <div class="row"><input id="perm-in-${esc(g.name)}" list="perm-catalog" placeholder="helix.command.fly" style="max-width:320px"><button class="btn sm" data-grant="${esc(g.name)}">Grant</button></div></div>
      <div class="field"><label>Add parent group</label>
        <div class="row"><select id="parent-in-${esc(g.name)}" style="max-width:220px">${doc.groups.filter(x=>x.name!==g.name).map(x=>`<option>${esc(x.name)}</option>`).join("")}</select><button class="btn sm subtle" data-addparent="${esc(g.name)}">Add</button></div></div>
    </div>
    <div style="margin-top:12px">${(g.permissions||[]).length ? (g.permissions||[]).map(p=>`<span class="chip">${esc(p)}<button data-revoke="${esc(g.name)}|${esc(p)}">×</button></span>`).join("") : '<span class="muted">no permissions</span>'}</div>
    <div style="margin-top:8px">${(g.parents||[]).map(p=>`<span class="chip">⤷ ${esc(p)}<button data-rmparent="${esc(g.name)}|${esc(p)}">×</button></span>`).join("")}</div>
  </div></td></tr>`;
}

function bindEditors() {
  const box = document.getElementById("groups");
  box.querySelectorAll("[data-grant]").forEach(b => b.onclick = async () => { const v = document.getElementById("perm-in-"+b.dataset.grant).value.trim(); if(!v) return; await Helix.action("perm.group.grant", b.dataset.grant, v); load(); });
  box.querySelectorAll("[data-revoke]").forEach(b => b.onclick = async () => { const [g,p]=b.dataset.revoke.split("|"); await Helix.action("perm.group.revoke", g, p); load(); });
  box.querySelectorAll("[data-addparent]").forEach(b => b.onclick = async () => { const v = document.getElementById("parent-in-"+b.dataset.addparent).value; if(!v) return; await Helix.action("perm.group.addparent", b.dataset.addparent, v); load(); });
  box.querySelectorAll("[data-rmparent]").forEach(b => b.onclick = async () => { const [g,p]=b.dataset.rmparent.split("|"); await Helix.action("perm.group.removeparent", g, p); load(); });
}

function renderUsers() {
  const box = document.getElementById("users");
  const users = doc.users || [];
  if (!users.length) { box.innerHTML = '<div class="empty">No users with explicit assignments yet</div>'; return; }
  box.innerHTML = `<table><thead><tr><th>Player</th><th>Groups</th><th>Permissions</th><th></th></tr></thead><tbody>${
    users.map(u => { const permCount = (u.permissions||[]).length + (u.timedPermissions||[]).length; return `<tr>
      <td><strong>${esc(u.name)}</strong></td>
      <td>${(u.groups||[]).map(g=>`<span class="tag">${esc(g)}</span>`).join(" ")
        + (u.timedGroups||[]).map(t=>`<span class="tag">⏱ ${esc(t.value)}</span>`).join(" ")
        || '<span class="muted">defaults</span>'}</td>
      <td>${permCount ? `<span class="tag">${permCount} nodes</span>` : '<span class="muted">—</span>'}</td>
      <td style="text-align:right"><button class="btn sm subtle" data-manage="${esc(u.name)}">Manage</button></td>
    </tr>`; }).join("")
  }</tbody></table>`;
  box.querySelectorAll("[data-manage]").forEach(b => b.onclick = () => { document.getElementById("user-name").value = b.dataset.manage; loadUser(); });
}

/* group creation modal */
const modal = document.getElementById("group-modal");
document.getElementById("new-group").onclick = () => {
  document.getElementById("g-name").value = "";
  document.getElementById("g-weight").value = "0";
  document.getElementById("g-default").checked = false;
  modal.classList.remove("hidden");
  document.getElementById("g-name").focus();
};
document.getElementById("g-cancel").onclick = () => modal.classList.add("hidden");
modal.onclick = e => { if (e.target === modal) modal.classList.add("hidden"); };
document.getElementById("g-create").onclick = async () => {
  const name = document.getElementById("g-name").value.trim();
  if (!name) return Helix.toast("Group name is required");
  const weight = document.getElementById("g-weight").value.trim() || "0";
  const def = document.getElementById("g-default").checked;
  const r = await Helix.action("perm.group.create", name, "weight=" + weight, "default=" + def);
  Helix.toast(r.lines[0] || "created");
  modal.classList.add("hidden");
  load();
};

async function loadUser() {
  const name = document.getElementById("user-name").value.trim(); if (!name) return;
  await load();
  const u = (doc.users || []).find(x => x.name.toLowerCase() === name.toLowerCase()) || { name: name.toLowerCase(), groups: [], permissions: [] };
  const defaults = doc.groups.filter(g => g.default).map(g => g.name);
  const groups = u.groups.length ? u.groups : defaults;
  const now = Date.now();
  const timedGroups = (u.timedGroups||[]).map(t=>`<span class="chip">${esc(t.value)} <span class="muted">(${remaining(t.expiresAtEpochMs-now)})</span><button data-ug="${esc(t.value)}">×</button></span>`).join("");
  const timedPerms = (u.timedPermissions||[]).map(t=>`<span class="chip">${esc(t.value)} <span class="muted">(${remaining(t.expiresAtEpochMs-now)})</span><button data-up="${esc(t.value)}">×</button></span>`).join("");
  document.getElementById("user-detail").innerHTML = `
    <div class="card" style="margin:0"><div class="card-head"><h2>${esc(u.name)}</h2></div><div class="card-body">
    <div class="grid c2">
      <div class="field"><label>Groups${u.groups.length ? "" : " (defaults)"}</label>
        <div>${groups.map(g=>`<span class="chip">${esc(g)}${u.groups.length?`<button data-ug="${esc(g)}">×</button>`:""}</span>`).join("") || '<span class="muted">none</span>'}${timedGroups}</div>
        <div class="row" style="margin-top:8px">
          <select id="ug-add" style="max-width:180px">${doc.groups.map(g=>`<option>${esc(g.name)}</option>`).join("")}</select>
          <input id="ug-dur" placeholder="duration (7d, empty = ∞)" style="max-width:160px">
          <button class="btn sm" id="ug-btn">Add to group</button></div></div>
      <div class="field"><label>Personal permissions (pick from catalog or type any)</label>
        <div>${(u.permissions||[]).map(p=>`<span class="chip">${esc(p)}<button data-up="${esc(p)}">×</button></span>`).join("") || '<span class="muted">none</span>'}${timedPerms}</div>
        <div class="row" style="margin-top:8px">
          <input id="up-in" list="perm-catalog" placeholder="node or -node" style="max-width:240px">
          <input id="up-dur" placeholder="duration (30m, empty = ∞)" style="max-width:160px">
          <button class="btn sm" id="up-btn">Grant</button></div></div>
    </div></div></div>`;
  const uname = u.name;
  document.getElementById("ug-btn").onclick = async () => {
    const dur = document.getElementById("ug-dur").value.trim();
    const args = [uname, document.getElementById("ug-add").value].concat(dur ? [dur] : []);
    const r = await Helix.action("perm.user.addgroup", ...args);
    if (!r.success) return Helix.toast(r.lines[0] || "failed");
    document.getElementById("user-name").value = uname; loadUser();
  };
  document.getElementById("up-btn").onclick = async () => {
    const v = document.getElementById("up-in").value.trim(); if(!v) return;
    const dur = document.getElementById("up-dur").value.trim();
    const r = await Helix.action("perm.user.grant", ...[uname, v].concat(dur ? [dur] : []));
    if (!r.success) return Helix.toast(r.lines[0] || "failed");
    document.getElementById("user-name").value = uname; loadUser();
  };
  document.querySelectorAll("[data-ug]").forEach(b => b.onclick = async () => { await Helix.action("perm.user.removegroup", uname, b.dataset.ug); document.getElementById("user-name").value = uname; loadUser(); });
  document.querySelectorAll("[data-up]").forEach(b => b.onclick = async () => { await Helix.action("perm.user.revoke", uname, b.dataset.up); document.getElementById("user-name").value = uname; loadUser(); });
}
document.getElementById("user-load").onclick = loadUser;
document.getElementById("user-name").onkeydown = e => { if (e.key === "Enter") loadUser(); };

Helix.ready(() => { load(); loadCatalog(); });
</script>
