<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helix-Cloud</title>
<style>
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f0f2f5;
  --surface-3: #e7eaef;
  --ink: #10151c;
  --ink-2: #5a6675;
  --ink-3: #8b96a6;
  --line: #e3e7ed;
  --line-strong: #d3d9e1;
  --accent: #5b5bf0;
  --accent-2: #7c6bf5;
  --accent-soft: #ecebfe;
  --accent-ink: #ffffff;
  --good: #17935a; --good-soft: #e0f3e9;
  --warn: #a86800; --warn-soft: #fdf0d5;
  --bad: #cc2f2f; --bad-soft: #fce8e8;
  --info: #1f74c4; --info-soft: #e4f0fb;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 1px 2px rgba(16,21,28,.06), 0 4px 16px rgba(16,21,28,.05);
  --shadow-lg: 0 8px 40px rgba(16,21,28,.16);
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
:root[data-theme="dark"] {
  --bg: #0b0e13;
  --surface: #151a22;
  --surface-2: #1c222c;
  --surface-3: #262e3a;
  --ink: #eef2f7;
  --ink-2: #a3afbf;
  --ink-3: #6b7788;
  --line: #232a35;
  --line-strong: #313a48;
  --accent: #7c7cff;
  --accent-2: #9a86ff;
  --accent-soft: #20213c;
  --accent-ink: #0b0e13;
  --good: #43cc84; --good-soft: #16301f;
  --warn: #e6b455; --warn-soft: #322611;
  --bad: #ff7a7a; --bad-soft: #351a1a;
  --info: #5eaaf0; --info-soft: #12283f;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  --shadow-lg: 0 8px 40px rgba(0,0,0,.5);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select, textarea {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 9px 11px; width: 100%;
  transition: border-color .15s, box-shadow .15s;
}
input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
::selection { background: var(--accent-soft); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-3); background-clip: padding-box; }

/* ---------- top loading bar ---------- */
#loadbar { position: fixed; top: 0; left: 0; height: 2px; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); z-index: 100; transition: width .3s, opacity .3s; opacity: 0; }
#loadbar.active { opacity: 1; }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
.sidebar {
  background: var(--surface); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 18px 14px; gap: 3px; position: sticky; top: 0; height: 100vh;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 18px; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 16px;
  box-shadow: 0 4px 12px rgba(91,91,240,.35);
}
.brand-name { font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
.brand-name small { display: block; font-weight: 500; font-size: 11px; color: var(--ink-3); letter-spacing: .02em; }
.nav-group { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); padding: 14px 12px 5px; }
.nav-btn {
  display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
  padding: 9px 12px; border-radius: var(--radius-sm); color: var(--ink-2); font-weight: 500;
  transition: background .13s, color .13s; position: relative;
}
.nav-btn:hover { background: var(--surface-2); color: var(--ink); }
.nav-btn.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-btn .ico { width: 18px; height: 18px; flex-shrink: 0; opacity: .85; }
.nav-btn .tag { margin-left: auto; font-size: 11px; background: var(--surface-3); color: var(--ink-2); padding: 1px 7px; border-radius: 20px; font-variant-numeric: tabular-nums; }
.nav-btn.active .tag { background: var(--accent); color: var(--accent-ink); }
.sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 3px; padding-top: 10px; }

.main { display: flex; flex-direction: column; min-width: 0; }
.topbar {
  display: flex; align-items: center; gap: 16px; padding: 14px 26px;
  border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 82%, transparent);
  backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 20;
}
.topbar h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
.topbar .crumb { color: var(--ink-3); font-size: 13px; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.status-chip { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); background: var(--surface-2); padding: 6px 12px; border-radius: 20px; font-weight: 500; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); }
.dot.pulse { animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
.icon-btn { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; color: var(--ink-2); transition: background .13s, color .13s; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }

.content { padding: 24px 26px; max-width: 1280px; width: 100%; }

/* ---------- stat tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 15px; margin-bottom: 22px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 17px 19px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.tile .t-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.tile .t-label { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.tile .t-ico { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.tile .t-value { font-size: 30px; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; }
.tile .t-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 6px; }
.tile.accent { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: none; color: #fff; }
.tile.accent .t-label, .tile.accent .t-sub { color: rgba(255,255,255,.85); }
.tile.accent .t-ico { background: rgba(255,255,255,.2); color: #fff; }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 20px; overflow: hidden; }
.card-head { display: flex; align-items: center; gap: 12px; padding: 15px 19px; border-bottom: 1px solid var(--line); }
.card-head h2 { font-size: 14.5px; margin: 0; font-weight: 650; }
.card-head .sub { color: var(--ink-3); font-size: 12.5px; }
.card-head .head-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.grid-2 { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; align-items: start; }
@media (max-width: 980px) { .grid-2 { grid-template-columns: 1fr; } .layout { grid-template-columns: 68px 1fr; } .brand-name, .nav-btn span:not(.tag):not(.ico), .nav-group { display: none; } }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 12px 19px; white-space: nowrap; }
th { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; border-bottom: 1px solid var(--line); background: var(--surface-2); }
tbody tr { transition: background .1s; }
tbody tr:hover { background: var(--surface-2); }
tbody tr + tr td { border-top: 1px solid var(--line); }
td { font-variant-numeric: tabular-nums; color: var(--ink); }
td .muted { color: var(--ink-3); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.empty { padding: 40px 20px; text-align: center; color: var(--ink-3); }
.empty .big { font-size: 15px; color: var(--ink-2); margin-bottom: 4px; font-weight: 500; }

/* ---------- badges & bars ---------- */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.b-running, .b-enabled, .b-info { color: var(--good); background: var(--good-soft); }
.b-starting, .b-stopping, .b-prepared, .b-warn { color: var(--warn); background: var(--warn-soft); }
.b-failed, .b-error { color: var(--bad); background: var(--bad-soft); }
.b-stopped, .b-disabled, .b-neutral { color: var(--ink-2); background: var(--surface-3); }
.badge.plain::before { display: none; }
.bar { height: 6px; background: var(--surface-3); border-radius: 4px; overflow: hidden; min-width: 70px; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 4px; transition: width .4s; }
.playercell { display: flex; align-items: center; gap: 9px; }
.playercell .n { font-size: 12.5px; color: var(--ink-2); min-width: 46px; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px; background: var(--accent); color: var(--accent-ink); font-weight: 600; border-radius: var(--radius-sm); transition: filter .13s, transform .05s; font-size: 13px; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }
.btn.sm { padding: 6px 11px; font-size: 12px; }
.btn.subtle { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line-strong); }
.btn.subtle:hover { background: var(--surface-3); filter: none; }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.ghost { background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); filter: none; }
.btn:disabled { opacity: .5; cursor: default; }
.row-actions { display: flex; gap: 6px; justify-content: flex-end; }

/* ---------- toggle switch ---------- */
.switch { position: relative; display: inline-flex; align-items: center; gap: 12px; cursor: pointer; }
.switch input { position: absolute; opacity: 0; }
.track { width: 46px; height: 26px; border-radius: 20px; background: var(--surface-3); transition: background .18s; flex-shrink: 0; position: relative; }
.track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .18s; }
.switch input:checked + .track { background: var(--warn); }
.switch input:checked + .track::after { transform: translateX(20px); }

/* ---------- segmented control ---------- */
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { padding: 5px 12px; border-radius: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.seg button.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* ---------- events timeline ---------- */
.events { padding: 6px 0; max-height: 560px; overflow-y: auto; }
.event { display: flex; gap: 13px; padding: 11px 19px; align-items: flex-start; }
.event:hover { background: var(--surface-2); }
.event .e-dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; background: var(--info); }
.event.lv-warn .e-dot { background: var(--warn); }
.event.lv-error .e-dot { background: var(--bad); }
.event .e-body { min-width: 0; flex: 1; }
.event .e-msg { font-size: 13px; color: var(--ink); word-break: break-word; }
.event .e-meta { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; display: flex; gap: 8px; }
.event .e-cat { text-transform: uppercase; letter-spacing: .04em; font-weight: 700; font-size: 10px; }

/* ---------- log terminal ---------- */
.logbox { background: #0a0d12; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); }
.logbar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #10141b; border-bottom: 1px solid #1c222c; }
.logbar .traffic { display: flex; gap: 6px; }
.logbar .traffic i { width: 11px; height: 11px; border-radius: 50%; display: block; }
.logview { font-family: var(--mono); font-size: 12px; line-height: 1.65; padding: 12px 16px; height: 62vh; overflow-y: auto; color: #c3ccd6; white-space: pre-wrap; word-break: break-word; }
.logview .l-warn { color: #e6b455; }
.logview .l-err { color: #ff8a8a; }
.logview .l-info { color: #7fd6a5; }
.logview .l-dim { color: #5a6675; }

/* ---------- modal ---------- */
.backdrop { position: fixed; inset: 0; background: rgba(8,11,16,.6); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 20px; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; width: 100%; max-width: 500px; max-height: 88vh; overflow: auto; box-shadow: var(--shadow-lg); animation: pop .18s; }
.modal.wide { max-width: 820px; }
@keyframes pop { from { transform: scale(.97) translateY(6px); opacity: 0; } }
.modal-head { display: flex; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--line); }
.modal-head h2 { margin: 0; font-size: 16px; font-weight: 650; }
.modal-body { padding: 20px 22px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 9px; padding: 16px 22px; border-top: 1px solid var(--line); background: var(--surface-2); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field.wide { grid-column: 1 / -1; }
.field label { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.field .hint { font-size: 11px; color: var(--ink-3); }

/* ---------- settings ---------- */
.kv { display: grid; grid-template-columns: 200px 1fr; gap: 0; }
.kv > div { padding: 13px 19px; border-bottom: 1px solid var(--line); }
.kv > div:nth-child(odd) { color: var(--ink-2); font-weight: 500; background: var(--surface-2); }
.kv > div:nth-child(even) { font-family: var(--mono); font-size: 13px; }
.copyable { display: inline-flex; align-items: center; gap: 8px; }

/* ---------- login ---------- */
.login { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(1200px 600px at 50% -10%, var(--accent-soft), var(--bg)); z-index: 80; padding: 20px; }
.login-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 34px; width: 380px; box-shadow: var(--shadow-lg); }
.login-card .brand { justify-content: center; padding: 0 0 20px; }
.login-card h1 { font-size: 19px; margin: 0 0 5px; text-align: center; }
.login-card p { color: var(--ink-3); text-align: center; margin: 0 0 22px; font-size: 13px; }
.login-card .btn { width: 100%; justify-content: center; padding: 11px; margin-top: 6px; }
.login-err { color: var(--bad); font-size: 13px; text-align: center; min-height: 20px; margin-top: 10px; }

.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); z-index: 90; background: var(--ink); color: var(--bg); padding: 11px 20px; border-radius: 11px; font-size: 13.5px; font-weight: 500; box-shadow: var(--shadow-lg); opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.hidden { display: none !important; }
.spin { animation: rot 1s linear infinite; } @keyframes rot { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="loadbar"></div>

<div id="login" class="login hidden">
  <div class="login-card">
    <div class="brand"><div class="brand-mark">H</div><div class="brand-name">Helix<small>Cloud</small></div></div>
    <h1>Welcome back</h1>
    <p>Sign in with your control token</p>
    <input id="login-token" type="password" placeholder="Control token" autocomplete="off">
    <button class="btn" id="login-btn">Sign in</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<div class="layout hidden" id="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">H</div><div class="brand-name">Helix<small>Cloud</small></div></div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <button class="nav-btn" id="theme-btn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg><span>Theme</span></button>
      <button class="nav-btn" id="logout-btn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg><span>Sign out</span></button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div><h1 id="page-title">Overview</h1></div>
      <div class="topbar-right">
        <div class="status-chip"><span class="dot pulse" id="conn-dot"></span><span id="conn-text">connected</span></div>
        <div class="status-chip" id="ver-chip">—</div>
      </div>
    </header>
    <div class="content" id="view"></div>
  </div>
</div>

<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const API = "/api/v1";
let token = localStorage.getItem("helix.token") || "";
let view = "overview";
let timer = null;
let logPaused = false;
let eventFilter = "all";
let panels = [];

const NAV = [
  { group: "Platform" },
  { id: "overview", label: "Overview", icon: '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>' },
  { id: "tasks", label: "Tasks", icon: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>' },
  { id: "services", label: "Services", icon: '<rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><path d="M6 6h.01M6 18h.01"/>' },
  { id: "proxy", label: "Proxy", icon: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>' },
  { group: "Observability" },
  { id: "events", label: "Events", icon: '<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>' },
  { id: "logs", label: "Logs", icon: '<path d="M4 4h16v16H4z"/><path d="M8 9l2 2-2 2M13 15h3"/>' },
  { group: "System" },
  { id: "addons", label: "Addons", icon: '<path d="M20 7h-4V3H8v4H4v14h16V7z"/><path d="M9 12h6M12 9v6"/>' },
  { id: "settings", label: "Settings", icon: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-2.7 1.1V21a2 2 0 01-4 0v-.1A1.6 1.6 0 007 19.4a1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00-1.1-2.7H1a2 2 0 010-4h.1A1.6 1.6 0 002.6 7a1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H7a1.6 1.6 0 001-1.5V1a2 2 0 014 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V7a1.6 1.6 0 001.5 1H21a2 2 0 010 4h-.1a1.6 1.6 0 00-1.5 1z"/>' },
];

/* ---------- helpers ---------- */
const $ = (s, e) => (e || document).querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const svg = (p, cls) => `<svg class="${cls||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

function loadbar(on) { $("#loadbar").classList.toggle("active", on); if (on) $("#loadbar").style.width = "70%"; else { $("#loadbar").style.width = "100%"; setTimeout(() => $("#loadbar").style.width = "0", 300); } }

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: { "Authorization": "Bearer " + token, ...(opts.body ? { "Content-Type": "application/json" } : {}), ...(opts.headers || {}) },
  });
  if (res.status === 401) { showLogin(); throw new Error("unauthorized"); }
  const text = await res.text();
  const body = text ? JSON.parse(text) : null;
  if (!res.ok) throw new Error(body && body.message ? body.message : "HTTP " + res.status);
  return body;
}
function setConn(ok) { $("#conn-dot").style.background = ok ? "var(--good)" : "var(--bad)"; $("#conn-dot").style.boxShadow = "0 0 0 3px " + (ok ? "var(--good-soft)" : "var(--bad-soft)"); $("#conn-text").textContent = ok ? "connected" : "disconnected"; }
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 2600); }
function badge(state) { return `<span class="badge b-${esc(String(state).toLowerCase())}">${esc(state)}</span>`; }
function ago(ms) { if (!ms) return "—"; const s = Math.floor((Date.now() - ms) / 1000); if (s < 60) return s + "s ago"; if (s < 3600) return Math.floor(s/60) + "m ago"; if (s < 86400) return Math.floor(s/3600) + "h ago"; return Math.floor(s/86400) + "d ago"; }
function uptime(ms) { if (!ms) return "—"; const s = Math.floor((Date.now()-ms)/1000); if (s<60) return s+"s"; if (s<3600) return Math.floor(s/60)+"m "+(s%60)+"s"; return Math.floor(s/3600)+"h "+Math.floor((s%3600)/60)+"m"; }
function playerBar(on, max) { const pct = max > 0 ? Math.min(100, (on/max)*100) : 0; return `<div class="playercell"><span class="n">${on}/${max}</span><div class="bar" title="${on}/${max}"><i style="width:${pct}%"></i></div></div>`; }

/* ---------- auth ---------- */
function showLogin() { stop(); $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); }
async function tryLogin(t) {

  buildNav(); render();
}
$("#login-btn").onclick = async () => { try { $("#login-err").textContent = ""; await tryLogin($("#login-token").value.trim()); } catch (e) { $("#login-err").textContent = "Sign in failed — check your token"; } };
$("#login-token").onkeydown = e => { if (e.key === "Enter") $("#login-btn").click(); };
$("#logout-btn").onclick = () => { localStorage.removeItem("helix.token"); token = ""; showLogin(); };

/* ---------- theme ---------- */
function applyTheme(t) {
  document.documentElement.dataset.theme = t; localStorage.setItem("helix.theme", t);
  const f = document.getElementById("panel-frame");
  if (f && f.contentWindow) { try { f.contentWindow.postMessage({ type: "helix:theme", css: panelThemeCss() }, "*"); } catch (e) {} }
}
$("#theme-btn").onclick = () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
applyTheme(localStorage.getItem("helix.theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

/* ---------- nav ---------- */
function buildNav() {
  let html = NAV.map(n => n.group
    ? `<div class="nav-group">${n.label || n.group}</div>`
    : `<button class="nav-btn" data-view="${n.id}">${svg(n.icon, "ico")}<span>${n.label}</span><span class="tag hidden" id="tag-${n.id}"></span></button>`
  ).join("");
  if (panels.length) {
    html += `<div class="nav-group">Extensions</div>` + panels.map(p =>
      `<button class="nav-btn" data-view="panel:${p.id}">${svg(p.icon || '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>', "ico")}<span>${esc(p.title)}</span></button>`
    ).join("");
  }
  $("#nav").innerHTML = html;
  document.querySelectorAll(".nav-btn[data-view]").forEach(b => b.onclick = () => { view = b.dataset.view; render(); });
}
function setTag(id, val) { const el = $("#tag-" + id); if (!el) return; if (val == null) el.classList.add("hidden"); else { el.textContent = val; el.classList.remove("hidden"); } }

/* ---------- render loop ---------- */
function stop() { if (timer) { clearInterval(timer); timer = null; } }
async function render() {
  stop();
  document.querySelectorAll(".nav-btn[data-view]").forEach(b => b.classList.toggle("active", b.dataset.view === view));
  if (view.startsWith("panel:")) {
    const p = panels.find(x => x.id === view.slice(6));
    $("#page-title").textContent = p ? p.title : "Extension";
    try { loadbar(true); await drawPanel(view.slice(6)); setConn(true); } catch (e) { if (e.message !== "unauthorized") setConn(false); } finally { loadbar(false); }
    return;
  }
  const def = VIEWS[view];
  $("#page-title").textContent = def.title;
  try { loadbar(true); await def.draw(); setConn(true); } catch (e) { if (e.message !== "unauthorized") { setConn(false); } } finally { loadbar(false); }
  if (def.interval) timer = setInterval(async () => { try { await def.draw(); setConn(true); } catch (e) { setConn(false); } }, def.interval);
}

.card-body{padding:16px 18px}
table{width:100%;border-collapse:collapse} th,td{text-align:left;padding:10px 18px;white-space:nowrap}
th{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:700;border-bottom:1px solid var(--line);background:var(--surface-2)}
tbody tr:hover{background:var(--surface-2)} tbody tr+tr td{border-top:1px solid var(--line)}
td{font-variant-numeric:tabular-nums} .muted{color:var(--ink-3)} .mono{font-family:var(--mono);font-size:12.5px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:var(--radius-sm);font-size:13px;transition:filter .13s}
.btn:hover{filter:brightness(1.08)} .btn.sm{padding:5px 10px;font-size:12px}
.btn.subtle{background:var(--surface-2);color:var(--ink);border:1px solid var(--line-strong)} .btn.subtle:hover{filter:none;background:var(--surface-3)}
.btn.danger{background:var(--bad-soft);color:var(--bad)} .btn.ghost{background:transparent;color:var(--ink-2)} .btn.ghost:hover{background:var(--surface-2);filter:none}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600}
.badge.good{color:var(--good);background:var(--good-soft)} .badge.warn{color:var(--warn);background:var(--warn-soft)} .badge.bad{color:var(--bad);background:var(--bad-soft)} .badge.neutral{color:var(--ink-2);background:var(--surface-3)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .grid{display:grid;gap:12px} .grid.c2{grid-template-columns:1fr 1fr} .grid.c3{grid-template-columns:1fr 1fr 1fr}
.field{display:flex;flex-direction:column;gap:5px} .field label{font-size:12px;color:var(--ink-2);font-weight:600}
.empty{padding:34px;text-align:center;color:var(--ink-3)}
.tag{font-size:11px;background:var(--surface-3);color:var(--ink-2);padding:1px 8px;border-radius:20px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:3px 6px 3px 11px;font-size:12px;margin:2px}
.chip button{color:var(--ink-3);width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:14px} .chip button:hover{background:var(--bad-soft);color:var(--bad)}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:6px}
`;
const PANEL_RUNTIME = `<script>(function(){let seq=0;const pending={};
window.addEventListener("message",function(ev){var m=ev.data||{};
 if(m.type==="helix:result"){var p=pending[m.id];if(p){delete pending[m.id];m.ok?p.resolve(m.result):p.reject(new Error(m.error||"error"));}}
 else if(m.type==="helix:theme"){var s=document.getElementById("helix-theme");if(s)s.textContent=m.css;}});
window.Helix={
 action:function(name){var args=[].slice.call(arguments,1).flat();return new Promise(function(res,rej){var id=++seq;pending[id]={resolve:res,reject:rej};parent.postMessage({type:"helix:action",id:id,action:name,args:args},"*");});},
 toast:function(msg){parent.postMessage({type:"helix:toast",message:String(msg)},"*");},
 ready:function(cb){document.readyState==="loading"?document.addEventListener("DOMContentLoaded",cb):cb();}
};})();<\/script>`;
let _panelBridge = false;
function ensurePanelBridge() {
  if (_panelBridge) return; _panelBridge = true;
  window.addEventListener("message", async (ev) => {
    const f = $("#panel-frame"); if (!f || ev.source !== f.contentWindow) return;
    const m = ev.data || {};
    if (m.type === "helix:action") {
      try { const r = await api("/actions", { method: "POST", body: JSON.stringify({ action: m.action, arguments: (m.args || []).map(String) }) }); f.contentWindow.postMessage({ type: "helix:result", id: m.id, ok: true, result: r }, "*"); }
      catch (e) { f.contentWindow.postMessage({ type: "helix:result", id: m.id, ok: false, error: e.message }, "*"); }
    } else if (m.type === "helix:toast") { toast(m.message); }
  });
}
async function drawPanel(id) {
  ensurePanelBridge();
  const panel = await api("/panels/" + id);
  const srcdoc = `<!DOCTYPE html><html><head><meta charset="utf-8">`
    + `<style id="helix-theme">${panelThemeCss()}</style><style>${PANEL_BASE_CSS}</style>${PANEL_RUNTIME}</head>`
    + `<body>${panel.html}</body></html>`;
  $("#view").innerHTML = `<iframe id="panel-frame" sandbox="allow-scripts" style="width:100%;height:calc(100vh - 120px);border:none;background:var(--bg);border-radius:var(--radius)"></iframe>`;
  $("#panel-frame").srcdoc = srcdoc;
}

/* ---------- actions ---------- */
async function svc(id, op) { try { await api(`/services/${id}/${op}`, { method: "POST" }); toast(`${op} ${id}`); if (view==='services') drawServices(); } catch (e) { toast(e.message); } }
async function startSvc(task) { try { const i = await api(`/tasks/${task}/services`, { method: "POST" }); toast("Deployed " + i.id); go("services"); } catch (e) { toast(e.message); } }
async function delTask(name) { if (!confirm(`Delete task ${name}?`)) return; try { await api(`/tasks/${name}`, { method: "DELETE" }); toast("Deleted " + name); drawTasks(); } catch (e) { toast(e.message); } }
async function addon(id, op) { try { await api(`/addons/${id}/${op}`, { method: "POST" }); toast(`${op}d ${id}`); drawAddons(); } catch (e) { toast(e.message); } }
function copyToken() { navigator.clipboard?.writeText(token); toast("Token copied"); }

/* ---------- modals ---------- */
function closeModal() { $("#modal-root").innerHTML = ""; }
function taskModal() {
  $("#modal-root").innerHTML = `<div class="backdrop" id="bd"><div class="modal"><div class="modal-head"><h2>New task</h2></div>
    <div class="modal-body"><div class="form-grid">
      <div class="field wide"><label>Name</label><input id="f-name" placeholder="Lobby"></div>
      <div class="field"><label>Platform</label><select id="f-env"><option value="PAPER">Paper (backend)</option><option value="VELOCITY">Velocity (proxy)</option></select></div>
      <div class="field"><label>Version</label><input id="f-version" value="1.21.11"></div>
      <div class="field"><label>Executor</label><select id="f-exec"><option>PROCESS</option><option>DOCKER</option></select></div>
      <div class="field"><label>Kind</label><select id="f-static"><option value="false">dynamic (temporary)</option><option value="true">static (persistent)</option></select></div>
      <div class="field"><label>Min services</label><input id="f-min" type="number" value="1" min="0"></div>
      <div class="field"><label>Max services</label><input id="f-max" type="number" value="1" min="1"></div>
      <div class="field"><label>Memory (MB)</label><input id="f-mem" type="number" value="1024" min="128"></div>
      <div class="field"><label>Max players</label><input id="f-players" type="number" value="100" min="1"></div>
      <div class="field"><label>Start port</label><input id="f-port" type="number" value="25565"></div>
      <div class="field"><label>Autoscale</label><select id="f-scale"><option value="false">off</option><option value="true">on</option></select></div>
    </div></div>
    <div class="modal-foot"><button class="btn subtle" onclick="closeModal()">Cancel</button><button class="btn" id="f-create">Create task</button></div>
  </div></div>`;
  $("#bd").onclick = e => { if (e.target.id === "bd") closeModal(); };
  $("#f-env").onchange = () => { const p = $("#f-env").value === "VELOCITY"; $("#f-port").value = p ? 25577 : 25565; $("#f-version").value = p ? "3.4.0" : "1.21.11"; };
  $("#f-create").onclick = async () => {
    const name = $("#f-name").value.trim(), version = $("#f-version").value.trim();
    if (!name) return toast("Name is required");
    if (!version) return toast("Version is required");
    const args = [name, $("#f-env").value, version, "executor=" + $("#f-exec").value, "static=" + $("#f-static").value,
      "min=" + $("#f-min").value, "max=" + $("#f-max").value, "memory=" + $("#f-mem").value,
      "maxplayers=" + $("#f-players").value, "startport=" + $("#f-port").value, "autoscale=" + $("#f-scale").value];
    try {
      const r = await api("/actions", { method: "POST", body: JSON.stringify({ action: "task.create", arguments: args }) });
      if (r.success) { closeModal(); toast(r.lines[0] || "created"); drawTasks(); } else toast(r.lines[0] || "failed");
    } catch (e) { toast(e.message); }
  };
}
async function showLogsModal(id) {
  $("#modal-root").innerHTML = `<div class="backdrop" id="bd"><div class="modal wide"><div class="modal-head"><h2>Logs — ${esc(id)}</h2></div>
    <div class="logview" id="mlogs" style="height:60vh;margin:0">loading…</div>
    <div class="modal-foot"><button class="btn subtle" onclick="closeLogsModal()">Close</button></div></div></div>`;
  $("#bd").onclick = e => { if (e.target.id === "bd") closeLogsModal(); };
  const load = async () => { try { const l = await api(`/services/${id}/logs?tail=300`); const b = $("#mlogs"); if (!b) return; const bottom = b.scrollHeight-b.scrollTop-b.clientHeight < 40; b.innerHTML = (l.lines.length ? l.lines : ["(no output)"]).map(x => { let c="l-dim"; if(/ERROR/.test(x))c="l-err"; else if(/WARN/.test(x))c="l-warn"; else if(/INFO/.test(x))c="l-info"; return `<div class="${c}">${esc(x)}</div>`; }).join(""); if (bottom) b.scrollTop = b.scrollHeight; } catch (e) {} };
  window._mlogTimer = setInterval(load, 2000); load();
}
function closeLogsModal() { clearInterval(window._mlogTimer); closeModal(); }

/* ---------- boot ---------- */
(async () => { if (!token) return showLogin(); try { await tryLogin(token); } catch (e) { showLogin(); } })();
</script>
</body>
</html>
