# Speicher für den Gesamtbau (releaseBundle kompiliert ~45 Module über einen geteilten Kotlin-Daemon):
# mit dem Standard-Heap läuft der Kotlin-Daemon in "GC overhead limit exceeded".
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.caching=true
