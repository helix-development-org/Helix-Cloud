<div class="card">
  <div class="card-head"><h2>Ban a player</h2></div>
  <div class="card-body">
    <div class="row">
      <input id="p" placeholder="Player" style="max-width:200px">
      <input id="d" placeholder="Duration (7d, 12h, perm)" value="perm" style="max-width:200px">
      <input id="r" placeholder="Reason" style="max-width:260px">
      <button class="btn danger" id="ban">Ban</button>
    </div>
  </div>
</div>
<div class="card">
  <div class="card-head"><h2>Active bans</h2><div class="right"><button class="btn sm subtle" id="refresh">Refresh</button></div></div>
  <div id="list"><div class="empty">loading…</div></div>
</div>
<script>
"use strict";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
function expiry(e) {
  if (!e.expiresAtEpochMs) return '<span class="badge bad">permanent</span>';
  const ms = e.expiresAtEpochMs - Date.now();
  if (ms <= 0) return '<span class="muted">expired</span>';
  const d = Math.floor(ms/86400000), h = Math.floor(ms%86400000/3600000), m = Math.floor(ms%3600000/60000);
  return '<span class="badge warn">' + (d>0?`${d}d ${h}h`:h>0?`${h}h ${m}m`:`${m}m`) + '</span>';
}
async function load() {
  const r = await Helix.action("ban.export");
  let bans = []; try { bans = JSON.parse(r.lines[0] || "[]"); } catch (e) {}
  const box = document.getElementById("list");
  box.innerHTML = bans.length ? `<table><thead><tr><th>Player</th><th>Reason</th><th>Expires</th><th></th></tr></thead><tbody>${
    bans.map(b => `<tr><td><strong>${esc(b.player)}</strong></td><td>${esc(b.reason)}</td><td>${expiry(b)}</td>
      <td style="text-align:right"><button class="btn sm subtle" data-pardon="${esc(b.player)}">Pardon</button></td></tr>`).join("")
  }</tbody></table>` : '<div class="empty">No active bans</div>';
  box.querySelectorAll("[data-pardon]").forEach(x => x.onclick = async () => { await Helix.action("ban.pardon", x.dataset.pardon); Helix.toast("Pardoned " + x.dataset.pardon); load(); });
}
document.getElementById("ban").onclick = async () => {
  const p = document.getElementById("p").value.trim(); if (!p) return Helix.toast("player required");
  const d = document.getElementById("d").value.trim() || "perm", r = document.getElementById("r").value.trim();
  const res = await Helix.action("ban.set", p, d, ...(r ? [r] : [])); Helix.toast(res.lines[0] || "banned");
  document.getElementById("p").value = document.getElementById("r").value = ""; load();
};
document.getElementById("refresh").onclick = load;
Helix.ready(load);
</script>
