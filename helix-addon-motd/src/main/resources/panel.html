<div id="profiles"></div>

<div class="card" style="margin-top:16px">
  <div class="card-head"><h2>Preview</h2><div class="sub">animates at each profile's interval ({online}=12 {max}=100)</div></div>
  <div class="card-body"><div class="grid c2">
    <div><label>Normal</label><div class="motd-prev" id="prev-normal"></div></div>
    <div><label>Maintenance</label><div class="motd-prev" id="prev-maintenance"></div></div>
  </div></div>
</div>

<style>
.motd-prev{background:#181818;border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;font-family:var(--mono);font-size:13px;line-height:1.6;white-space:pre-wrap;min-height:52px}
.motd-prev .cnt{float:right;color:#aaa}
.frame-row{border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px;margin-bottom:8px}
</style>

<script>
"use strict";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const COLORS = { "0":"#000","1":"#00a","2":"#0a0","3":"#0aa","4":"#a00","5":"#a0a","6":"#fa0","7":"#aaa","8":"#555","9":"#55f","a":"#5f5","b":"#5ff","c":"#f55","d":"#f5f","e":"#ff5","f":"#fff" };
const MINI = { black:"#000",dark_blue:"#00a",dark_green:"#0a0",dark_aqua:"#0aa",dark_red:"#a00",dark_purple:"#a0a",gold:"#fa0",gray:"#aaa",dark_gray:"#555",blue:"#55f",green:"#5f5",aqua:"#5ff",red:"#f55",light_purple:"#f5f",yellow:"#ff5",white:"#fff" };
let cfg = null;
const timers = {};

function mc(text) {
  let t = String(text).replace(/\{online\}/g,"12").replace(/\{max\}/g,"100").replace(/\{network\}/g,"MyNetwork");
  t = t.replace(/<gradient:([^:>]+)[^>]*>/gi, (m,c)=>`<<c:${c}>>`).replace(/<\/gradient>/gi,"<<r>>");
  t = t.replace(/<#([0-9a-f]{6})>/gi, "<<c:#$1>>");
  t = t.replace(/<(\w+)>/g, (m,name)=> MINI[name.toLowerCase()] ? `<<c:${MINI[name.toLowerCase()]}>>` : (name==="bold"?"<<b>>":name==="reset"?"<<r>>":""));
  t = t.replace(/<\/\w+>/g, "");
  let out = "", color = "#eee", bold = false;
  const parts = t.split(/(&[0-9a-fk-or]|<<c:[^>]+>>|<<b>>|<<r>>)/i);
  for (const p of parts) {
    if (!p) continue;
    if (/^&[0-9a-f]$/i.test(p)) { color = COLORS[p[1].toLowerCase()]; continue; }
    if (/^&l$/i.test(p)) { bold = true; continue; }
    if (/^&r$/i.test(p)) { color = "#eee"; bold = false; continue; }
    if (/^&[k-o]$/i.test(p)) continue;
    if (p.startsWith("<<c:")) { color = p.slice(4,-2); continue; }
    if (p === "<<b>>") { bold = true; continue; }
    if (p === "<<r>>") { color = "#eee"; bold = false; continue; }
    out += `<span style="color:${color}${bold?";font-weight:700":""}">${esc(p)}</span>`;
  }
  return out;
}

function frameRows(name, p) {
  return p.frames.map((f, i) => `
    <div class="frame-row">
      <div class="row" style="justify-content:space-between"><span class="muted">Frame ${i + 1}</span>
        ${p.frames.length > 1 ? `<button class="btn sm danger" data-p="${name}" data-rmf="${i}">Remove</button>` : ""}</div>
      <div class="field" style="margin-top:6px"><input class="mono" data-p="${name}" data-fi="${i}" data-f="line1" value="${esc(f.line1)}" placeholder="Line 1"></div>
      <div class="field" style="margin-top:6px"><input class="mono" data-p="${name}" data-fi="${i}" data-f="line2" value="${esc(f.line2)}" placeholder="Line 2"></div>
    </div>`).join("");
}

function profileCard(name, p) {
  return `<div class="card" style="margin-bottom:16px">
    <div class="card-head"><h2>${name === "normal" ? "Normal" : "Maintenance"}</h2>
      <div class="sub">${name === "normal" ? "served while the network is open" : "served while maintenance is on"}</div>
      <div class="right"><button class="btn sm subtle" data-addf="${name}">+ Frame</button></div></div>
    <div class="card-body">
      ${frameRows(name, p)}
      <div class="grid c2" style="margin-top:10px">
        <div class="field"><label>Frame interval (ms, min 500)</label><input type="number" min="500" step="500" data-p="${name}" data-f="frameIntervalMs" value="${p.frameIntervalMs}"></div>
        <div class="field"><label>Version text (empty = default)</label><input class="mono" data-p="${name}" data-f="versionText" value="${esc(p.versionText)}"></div>
        <div class="field"><label>Shown online (-1 = real)</label><input type="number" data-p="${name}" data-f="onlinePlayers" value="${p.onlinePlayers}"></div>
        <div class="field"><label>Shown max (-1 = real)</label><input type="number" data-p="${name}" data-f="maxPlayers" value="${p.maxPlayers}"></div>
      </div>
      <div class="field" style="margin-top:10px"><label>Hover lines (player-count tooltip, one per line)</label>
        <textarea class="mono" rows="3" data-p="${name}" data-f="hover">${esc((p.hover||[]).join("\n"))}</textarea></div>
      <div class="row" style="margin-top:12px"><button class="btn" data-save="${name}">Save ${name}</button></div>
    </div></div>`;
}

function bind() {
  document.querySelectorAll("#profiles [data-f]").forEach(el => el.oninput = () => {
    const p = cfg[el.dataset.p];
    if (el.dataset.fi !== undefined) p.frames[+el.dataset.fi][el.dataset.f] = el.value;
    else if (el.dataset.f === "hover") p.hover = el.value.split("\n").map(s=>s.trim()).filter(Boolean);
    else if (el.type === "number") p[el.dataset.f] = parseInt(el.value) || 0;
    else p[el.dataset.f] = el.value;
    if (el.dataset.f === "frameIntervalMs" || el.dataset.fi !== undefined) startPreview(el.dataset.p);
  });
  document.querySelectorAll("[data-addf]").forEach(b => b.onclick = () => {
    const p = cfg[b.dataset.addf];
    if (p.frames.length >= 20) return Helix.toast("max 20 frames");
    p.frames.push({ ...p.frames[p.frames.length - 1] });
    render();
  });
  document.querySelectorAll("[data-rmf]").forEach(b => b.onclick = () => {
    cfg[b.dataset.p].frames.splice(+b.dataset.rmf, 1); render();
  });
  document.querySelectorAll("[data-save]").forEach(b => b.onclick = () => save());
}

function render() {
  document.getElementById("profiles").innerHTML = profileCard("normal", cfg.normal) + profileCard("maintenance", cfg.maintenance);
  bind();
  startPreview("normal"); startPreview("maintenance");
}

function startPreview(name) {
  clearInterval(timers[name]);
  const p = cfg[name];
  let idx = 0;
  const draw = () => {
    const f = p.frames[idx % p.frames.length] || { line1: "", line2: "" };
    const online = p.onlinePlayers === -1 ? "12" : p.onlinePlayers, max = p.maxPlayers === -1 ? "100" : p.maxPlayers;
    const el = document.getElementById("prev-" + name);
    if (el) el.innerHTML = `<span class="cnt">${esc(online)}/${esc(max)}</span>` + mc(f.line1) + "<br>" + mc(f.line2);
    idx++;
  };
  draw();
  if (p.frames.length > 1) timers[name] = setInterval(draw, Math.max(500, p.frameIntervalMs || 3000));
}

async function save() {
  const out = JSON.parse(JSON.stringify(cfg));
  ["normal","maintenance"].forEach(n => {
    const p = out[n];
    p.line1 = p.frames[0]?.line1 || ""; p.line2 = p.frames[0]?.line2 || "";
    p.frameIntervalMs = Math.max(500, p.frameIntervalMs || 3000);
  });
  const r = await Helix.action("motd.import", JSON.stringify(out));
  Helix.toast(r.lines[0] || (r.success ? "saved" : "failed"));
}

async function load() {
  const r = await Helix.action("motd.export");
  let c = {}; try { c = JSON.parse(r.lines[0] || "{}"); } catch (e) {}
  cfg = { normal: normalize(c.normal), maintenance: normalize(c.maintenance) };
  render();
}
function normalize(p) {
  p = { line1:"", line2:"", onlinePlayers:-1, maxPlayers:-1, versionText:"", hover:[], frames:[], frameIntervalMs:3000, ...(p||{}) };
  if (!p.frames.length) p.frames = [{ line1: p.line1, line2: p.line2 }];
  return p;
}
Helix.ready(load);
</script>
